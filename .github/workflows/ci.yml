              ilbody = info_logs.json() if info_logs.status_code == 200 else {}
              check("jobs/{id}/logs level filter 200",
                    info_logs.status_code == 200
                    and all(e.get("level") == "info" for e in ilbody.get("entries", [])),
                    info_logs.text)
              paged = httpx.get(
                  f"{base}/jobs/{job_id}/logs", params={"limit": 1}, timeout=5)
              pbody = paged.json() if paged.status_code == 200 else {}
              check("jobs/{id}/logs limit page 200",
                    paged.status_code == 200 and len(pbody.get("entries", [])) <= 1,
                    paged.text)
