          jf_limited = httpx.get(f"{base}/jobs/feed", params={"limit": 1}, timeout=5)
          jflbody = jf_limited.json() if jf_limited.status_code == 200 else {}
          check("jobs/feed limit bounds page not total",
                jf_limited.status_code == 200
                and len(jflbody.get("items", [])) <= 1
                and jflbody.get("total") == jfbody.get("total"), jf_limited.text)
          jf_status = httpx.get(f"{base}/jobs/feed", params={"status": "queued"}, timeout=5)
          jfsbody = jf_status.json() if jf_status.status_code == 200 else {}
          check("jobs/feed status filter 200",
                jf_status.status_code == 200
                and isinstance(jfsbody.get("total"), int)
                and jfsbody.get("total", 0) <= jfbody.get("total", 0)
                and all(i.get("status") == "queued"
                        for i in jfsbody.get("items", [])), jf_status.text)
          if project_id:
              jf_scoped = httpx.get(
                  f"{base}/jobs/feed", params={"project_id": project_id}, timeout=5)
              jfspbody = jf_scoped.json() if jf_scoped.status_code == 200 else {}
              check("jobs/feed project scope 200",
                    jf_scoped.status_code == 200
                    and isinstance(jfspbody.get("total"), int)
                    and jfspbody.get("total", 0) >= 1
                    and jfspbody.get("total", 0) <= jfbody.get("total", 0)
                    and all(i.get("project_id") == project_id
                            for i in jfspbody.get("items", [])), jf_scoped.text)
          else:
              check("jobs/feed project scope setup", False,
                    "could not obtain a project id")
          jf_missing = httpx.get(
              f"{base}/jobs/feed",
              params={"project_id": "00000000-0000-4000-8000-000000000000"}, timeout=5)
          jf404body = jf_missing.json() if jf_missing.status_code == 404 else {}
          check("jobs/feed 404 shared envelope",
                jf_missing.status_code == 404
                and jf404body.get("error", {}).get("code") == "project_not_found"
                and bool(jf404body.get("error", {}).get("request_id")), jf_missing.text)
          jf_bad = httpx.get(
              f"{base}/jobs/feed", params={"project_id": "not-a-uuid"}, timeout=5)
          jfbadbody = jf_bad.json() if jf_bad.status_code == 422 else {}
          check("jobs/feed 422 malformed id envelope",
                jf_bad.status_code == 422
                and jfbadbody.get("error", {}).get("code") == "validation_error"
                and bool(jfbadbody.get("error", {}).get("request_id")), jf_bad.text)
          jf_bad_status = httpx.get(
              f"{base}/jobs/feed", params={"status": "mystery"}, timeout=5)
          jfbsbody = jf_bad_status.json() if jf_bad_status.status_code == 422 else {}
          check("jobs/feed 422 invalid status envelope",
                jf_bad_status.status_code == 422
                and jfbsbody.get("error", {}).get("code") == "validation_error"
                and bool(jfbsbody.get("error", {}).get("request_id")), jf_bad_status.text)
          jf_bad_limit = httpx.get(f"{base}/jobs/feed", params={"limit": 0}, timeout=5)
          jfblbody = jf_bad_limit.json() if jf_bad_limit.status_code == 422 else {}
          check("jobs/feed 422 invalid limit envelope",
                jf_bad_limit.status_code == 422
                and jfblbody.get("error", {}).get("code") == "validation_error"
                and bool(jfblbody.get("error", {}).get("request_id")), jf_bad_limit.text)

          # Authoritative project feed (C145/C147) is the newest /api/v1 URL the
          # live client calls (getProjectFeed). Reuse the on-demand project so
          # the derived feed has a real item, then probe the feed shape, item
          # shapes, newest-first order, lifecycle filter, `limit` page bound,
          # optional org scope (an unknown-but-valid org yields a zero-filled
          # 200) and the shared 422 envelopes, keeping CI aligned with new
          # endpoints as they go live.
          project_feed = httpx.get(f"{base}/projects/feed", timeout=5)
          pfbody = project_feed.json() if project_feed.status_code == 200 else {}
          check("projects/feed 200 feed shape",
                project_feed.status_code == 200
                and isinstance(pfbody.get("items"), list)
                and isinstance(pfbody.get("total"), int)
                and "generated_at" in pfbody, project_feed.text)
          check("projects/feed derived item shape",
                project_feed.status_code == 200
                and pfbody.get("total", 0) >= 1
                and len(pfbody.get("items", [])) >= 1
                and all(all(k in item for k in (
                    "project_id", "org_id", "org_name", "name", "description",
                    "lifecycle", "created_by", "created_at", "updated_at"))
                    for item in pfbody["items"]), project_feed.text)
          check("projects/feed request-id header",
                "x-request-id" in {k.lower() for k in project_feed.headers},
                str(dict(project_feed.headers)))
          pf_item = None
          if project_id:
              pf_item = next(
                  (i for i in pfbody.get("items", []) if i.get("project_id") == project_id),
                  None)
              check("projects/feed derived project",
                    project_feed.status_code == 200 and pf_item is not None
                    and pf_item.get("lifecycle") in ("active", "archived")
                    and isinstance(pf_item.get("org_name"), str)
                    and bool(pf_item.get("org_name"))
                    and isinstance(pf_item.get("created_at"), str)
                    and isinstance(pf_item.get("updated_at"), str),
                    project_feed.text)
          else:
              check("projects/feed derived setup", False,
                    "could not obtain a project id for the feed probe")
          pf_created_times = [i.get("created_at") for i in pfbody.get("items", [])]
          check("projects/feed newest-first order",
                project_feed.status_code == 200
                and pf_created_times == sorted(pf_created_times, reverse=True),
                project_feed.text)
          pf_limited = httpx.get(f"{base}/projects/feed", params={"limit": 1}, timeout=5)
          pflbody = pf_limited.json() if pf_limited.status_code == 200 else {}
          check("projects/feed limit bounds page not total",
                pf_limited.status_code == 200
                and len(pflbody.get("items", [])) <= 1
                and pflbody.get("total") == pfbody.get("total"), pf_limited.text)
          pf_lifecycle = httpx.get(
              f"{base}/projects/feed", params={"lifecycle": "active"}, timeout=5)
          pfcybody = pf_lifecycle.json() if pf_lifecycle.status_code == 200 else {}
          check("projects/feed lifecycle filter 200",
                pf_lifecycle.status_code == 200
                and isinstance(pfcybody.get("total"), int)
                and pfcybody.get("total", 0) <= pfbody.get("total", 0)
                and all(i.get("lifecycle") == "active"
                        for i in pfcybody.get("items", [])), pf_lifecycle.text)
          pf_org = pf_item.get("org_id") if pf_item else None
          if pf_org:
              pf_scoped = httpx.get(
                  f"{base}/projects/feed", params={"org_id": pf_org}, timeout=5)
              pfspbody = pf_scoped.json() if pf_scoped.status_code == 200 else {}
              check("projects/feed org scope 200",
                    pf_scoped.status_code == 200
                    and isinstance(pfspbody.get("total"), int)
                    and pfspbody.get("total", 0) >= 1
                    and pfspbody.get("total", 0) <= pfbody.get("total", 0)
                    and all(i.get("org_id") == pf_org
                            for i in pfspbody.get("items", [])), pf_scoped.text)
          else:
              check("projects/feed org scope setup", False,
                    "could not read an org id from the derived feed item")
          pf_unknown_org = httpx.get(
              f"{base}/projects/feed",
              params={"org_id": "00000000-0000-4000-8000-000000000000"}, timeout=5)
          pfuobody = pf_unknown_org.json() if pf_unknown_org.status_code == 200 else {}
          check("projects/feed unknown org zero-filled 200",
                pf_unknown_org.status_code == 200
                and pfuobody.get("total") == 0
                and pfuobody.get("items") == [], pf_unknown_org.text)
          pf_bad = httpx.get(
              f"{base}/projects/feed", params={"org_id": "not-a-uuid"}, timeout=5)
          pfbadbody = pf_bad.json() if pf_bad.status_code == 422 else {}
          check("projects/feed 422 malformed org envelope",
                pf_bad.status_code == 422
                and pfbadbody.get("error", {}).get("code") == "validation_error"
                and bool(pfbadbody.get("error", {}).get("request_id")), pf_bad.text)
          pf_bad_lifecycle = httpx.get(
              f"{base}/projects/feed", params={"lifecycle": "mystery"}, timeout=5)
          pfblcbody = pf_bad_lifecycle.json() if pf_bad_lifecycle.status_code == 422 else {}
          check("projects/feed 422 invalid lifecycle envelope",
                pf_bad_lifecycle.status_code == 422
                and pfblcbody.get("error", {}).get("code") == "validation_error"
                and bool(pfblcbody.get("error", {}).get("request_id")),
                pf_bad_lifecycle.text)
          pf_bad_limit = httpx.get(f"{base}/projects/feed", params={"limit": 0}, timeout=5)
          pfbltbody = pf_bad_limit.json() if pf_bad_limit.status_code == 422 else {}
          check("projects/feed 422 invalid limit envelope",
                pf_bad_limit.status_code == 422
                and pfbltbody.get("error", {}).get("code") == "validation_error"
                and bool(pfbltbody.get("error", {}).get("request_id")), pf_bad_limit.text)

          invalid = httpx.get(f"{base}/projects/not-a-uuid", timeout=5)
          ebody = invalid.json()
          check("422 validation envelope", invalid.status_code == 422 and ebody.get("error", {}).get("code") == "validation_error", invalid.text)
          check("422 request-id in body", bool(ebody.get("error", {}).get("request_id")), invalid.text)

          if failures:
              print("live-mode smoke FAILED:\n" + "\n".join(failures), file=sys.stderr)
              sys.exit(1)
          print("live-mode smoke OK")
          PY
      - name: Stop the API server
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/uvicorn.pid")" 2>/dev/null || true

  tauri:
    name: Tauri shell (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Linux WebKit/GTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - name: Cache Rust target
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: frontend/src-tauri
      - name: Build Tauri shell (no bundle)
        working-directory: frontend
        run: npx tauri build --no-bundle
