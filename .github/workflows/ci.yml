              check("orgs/{id}/overview 404 shared envelope",
                    orgov_missing.status_code == 404
                    and oo404body.get("error", {}).get("code") == "organization_not_found"
                    and bool(oo404body.get("error", {}).get("request_id")),
                    orgov_missing.text)
              orgov_bad_id = httpx.get(f"{base}/orgs/not-a-uuid/overview", timeout=5)
              oobadbody = (orgov_bad_id.json()
                           if orgov_bad_id.status_code == 422 else {})
              check("orgs/{id}/overview 422 malformed id envelope",
                    orgov_bad_id.status_code == 422
                    and oobadbody.get("error", {}).get("code") == "validation_error"
                    and bool(oobadbody.get("error", {}).get("request_id")),
                    orgov_bad_id.text)
              for bad_limit in (0, 51):
                  olbad = httpx.get(
                      f"{base}/orgs/{created_org_id}/overview",
                      params={"recent_limit": bad_limit}, timeout=5)
                  olbbody = (olbad.json() if olbad.status_code == 422 else {})
                  check(f"orgs/{{id}}/overview 422 invalid recent_limit={bad_limit} envelope",
                        olbad.status_code == 422
                        and olbbody.get("error", {}).get("code") == "validation_error"
                        and bool(olbbody.get("error", {}).get("request_id")),
                        olbad.text)
          else:
              check("orgs/{id}/overview setup", False,
                    "could not obtain an organization id for the overview probe")

          invalid = httpx.get(f"{base}/projects/not-a-uuid", timeout=5)
          ebody = invalid.json()
          check("422 validation envelope", invalid.status_code == 422 and ebody.get("error", {}).get("code") == "validation_error", invalid.text)
          check("422 request-id in body", bool(ebody.get("error", {}).get("request_id")), invalid.text)

          if failures:
              print("live-mode smoke FAILED:\n" + "\n".join(failures), file=sys.stderr)
              sys.exit(1)
          print("live-mode smoke OK")
          PY
      - name: Stop the API server
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/uvicorn.pid")" 2>/dev/null || true

  tauri:
    name: Tauri shell (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Linux WebKit/GTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - name: Cache Rust target
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: frontend/src-tauri
      - name: Build Tauri shell (no bundle)
        working-directory: frontend
        run: npx tauri build --no-bundle
