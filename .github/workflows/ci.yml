name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-workflows:
    name: Validate workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Lint workflow definitions (actionlint)
        # Pinned Go module version (immutable in the Go module proxy) keeps this
        # self-check reproducible without adding an unpinned third-party Action.
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color .github/workflows/*.yml

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Coverage (supports C2)
        run: npm run test:coverage
      - name: Build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Test
        run: python -m pytest -q
      - name: "Coverage gate (supports C1, >=90% routers)"
        run: python -m pytest -q --cov=app --cov-report=term-missing --cov-fail-under=90

  live-smoke:
    name: Live-mode API smoke (HTTP)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Start the API server (in-memory store)
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/uvicorn.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/uvicorn.pid"
      - name: Wait for readiness
        run: |
          for _ in $(seq 1 30); do
            if python -c "import httpx,sys; sys.exit(0 if httpx.get('http://127.0.0.1:8000/api/v1/health', timeout=1).status_code == 200 else 1)"; then
              exit 0
            fi
            sleep 1
          done
          echo "API server did not become healthy in time"
          cat "$RUNNER_TEMP/uvicorn.log"
          exit 1
      - name: Exercise live-mode endpoints
        # Boots the real ASGI server and hits the exact /api/v1 URLs the
        # frontend's VITE_API_MODE=live httpApiClient depends on, plus the
        # shared error envelope. Complements the in-process pytest suite.
        run: |
          python - <<'PY'
          import sys
          import httpx

          base = "http://127.0.0.1:8000/api/v1"
          failures = []

          def check(label, condition, detail=""):
              if condition:
                  print(f"ok: {label}")
              else:
                  failures.append(f"{label}: {detail}")

          health = httpx.get(f"{base}/health", timeout=5)
          check("health 200", health.status_code == 200, health.text)
          check("health status ok", health.json().get("status") == "ok", health.text)
          check("health request-id header", "x-request-id" in {k.lower() for k in health.headers}, str(dict(health.headers)))

          projects = httpx.get(f"{base}/projects", timeout=5)
          check("projects 200 list", projects.status_code == 200 and isinstance(projects.json(), list), projects.text)

          providers = httpx.get(f"{base}/providers", timeout=5)
          body = providers.json() if providers.status_code == 200 else []
          check("providers 200 non-empty list", providers.status_code == 200 and isinstance(body, list) and len(body) > 0, providers.text)

          capabilities = httpx.get(f"{base}/capabilities", timeout=5)
          check("capabilities 200 list", capabilities.status_code == 200 and isinstance(capabilities.json(), list), capabilities.text)

          search = httpx.get(f"{base}/search", params={"q": "studio"}, timeout=5)
          sbody = search.json() if search.status_code == 200 else {}
          check("search 200 query/results", search.status_code == 200 and "query" in sbody and "results" in sbody, search.text)

          # Dashboard snapshot (C25/C27) is another /api/v1 URL the live client
          # calls on the home screen; probe its shape and its 422 bound guard.
          dashboard = httpx.get(f"{base}/dashboard", timeout=5)
          dbody = dashboard.json() if dashboard.status_code == 200 else {}
          check("dashboard 200 snapshot",
                dashboard.status_code == 200 and all(
                    k in dbody for k in ("counts", "generated_at", "jobs_by_status",
                                         "assets_by_type", "recent_jobs", "recent_assets")),
                dashboard.text)
          check("dashboard counts shape",
                isinstance(dbody.get("counts"), dict) and all(
                    k in dbody["counts"] for k in ("projects", "assets", "conversations",
                                                  "jobs", "providers", "enabled_extensions")),
                dashboard.text)
          limited = httpx.get(f"{base}/dashboard", params={"recent_limit": 1}, timeout=5)
          lbody = limited.json() if limited.status_code == 200 else {}
          check("dashboard recent_limit=1 200",
                limited.status_code == 200 and len(lbody.get("recent_jobs", [])) <= 1
                and len(lbody.get("recent_assets", [])) <= 1, limited.text)
          bad_limit = httpx.get(f"{base}/dashboard", params={"recent_limit": 0}, timeout=5)
          blbody = bad_limit.json() if bad_limit.status_code == 422 else {}
          check("dashboard 422 validation envelope",
                bad_limit.status_code == 422
                and blbody.get("error", {}).get("code") == "validation_error"
                and bool(blbody.get("error", {}).get("request_id")), bad_limit.text)

          # Project audit trail (C18/C20) is consumed live on project detail.
          # The in-memory store starts empty, so create a project when needed.
          seeded = projects.json() if projects.status_code == 200 else []
          if isinstance(seeded, list) and seeded:
              project_id = seeded[0]["id"]
          else:
              created = httpx.post(f"{base}/projects", json={"name": "CI smoke audit"}, timeout=5)
              project_id = created.json().get("id") if created.status_code == 201 else None
          if project_id:
              audit = httpx.get(f"{base}/projects/{project_id}/audit", timeout=5)
              abody = audit.json() if audit.status_code == 200 else {}
              check("project audit 200 trail",
                    audit.status_code == 200 and abody.get("project_id") == project_id
                    and isinstance(abody.get("events"), list), audit.text)
          else:
              check("project audit setup", False, "could not obtain a project id")

          # Workspace activity feed (C29/C31) is the cross-project complement to
          # the per-project audit above and another /api/v1 URL the live client
          # calls. Probe its shape, filters and shared error envelopes.
          activity = httpx.get(f"{base}/activity", timeout=5)
          actbody = activity.json() if activity.status_code == 200 else {}
          check("activity 200 feed shape",
                activity.status_code == 200 and isinstance(actbody.get("events"), list)
                and isinstance(actbody.get("total"), int), activity.text)
          act_filtered = httpx.get(f"{base}/activity", params={"kind": "job", "limit": 1}, timeout=5)
          actfbody = act_filtered.json() if act_filtered.status_code == 200 else {}
          check("activity filters 200",
                act_filtered.status_code == 200 and isinstance(actfbody.get("events"), list),
                act_filtered.text)
          act_bad = httpx.get(f"{base}/activity", params={"limit": 0}, timeout=5)
          actbadbody = act_bad.json() if act_bad.status_code == 422 else {}
          check("activity 422 validation envelope",
                act_bad.status_code == 422
                and actbadbody.get("error", {}).get("code") == "validation_error"
                and bool(actbadbody.get("error", {}).get("request_id")), act_bad.text)
          act_missing = httpx.get(
              f"{base}/activity",
              params={"project_id": "00000000-0000-4000-8000-000000000000"}, timeout=5)
          act404body = act_missing.json() if act_missing.status_code == 404 else {}
          check("activity 404 shared envelope",
                act_missing.status_code == 404
                and act404body.get("error", {}).get("code") == "project_not_found"
                and bool(act404body.get("error", {}).get("request_id")), act_missing.text)

          # Asset tag facets (C33) and downstream impact (C34) are the newest
          # authoritative /api/v1 URLs the live client calls (getTags /
          # getAssetImpact). Probe their shapes, filters + shared envelopes.
          tag_index = httpx.get(f"{base}/tags", timeout=5)
          tibody = tag_index.json() if tag_index.status_code == 200 else {}
          check("tags 200 index shape",
                tag_index.status_code == 200 and isinstance(tibody.get("tags"), list)
                and isinstance(tibody.get("total"), int), tag_index.text)
          tag_prefixed = httpx.get(f"{base}/tags", params={"prefix": "char"}, timeout=5)
          tpb = tag_prefixed.json() if tag_prefixed.status_code == 200 else {}
          check("tags prefix filter 200",
                tag_prefixed.status_code == 200 and isinstance(tpb.get("tags"), list),
                tag_prefixed.text)
          tag_bad = httpx.get(f"{base}/tags", params={"limit": 0}, timeout=5)
          tbadbody = tag_bad.json() if tag_bad.status_code == 422 else {}
          check("tags 422 validation envelope",
                tag_bad.status_code == 422
                and tbadbody.get("error", {}).get("code") == "validation_error"
                and bool(tbadbody.get("error", {}).get("request_id")), tag_bad.text)
          tag_missing = httpx.get(
              f"{base}/tags",
              params={"project_id": "00000000-0000-4000-8000-000000000000"}, timeout=5)
          t404body = tag_missing.json() if tag_missing.status_code == 404 else {}
          check("tags 404 shared envelope",
                tag_missing.status_code == 404
                and t404body.get("error", {}).get("code") == "project_not_found"
                and bool(t404body.get("error", {}).get("request_id")), tag_missing.text)

          # Register one tagged asset so both derived endpoints have a real
          # root (the in-memory store does not seed projects/assets).
          asset_id = None
          if project_id:
              registered = httpx.post(
                  f"{base}/assets/register",
                  json={
                      "project_id": project_id,
                      "type": "image",
                      "name": "CI smoke impact root",
                      "tags": ["ci-smoke"],
                      "storage": {"backend": "local", "key": "ci/smoke.png",
                                  "size_bytes": 1, "content_type": "image/png"},
                  },
                  timeout=5)
              asset_id = registered.json().get("id") if registered.status_code == 201 else None

          impact = httpx.get(
              f"{base}/assets/00000000-0000-4000-8000-000000000000/impact", timeout=5)
          i404body = impact.json() if impact.status_code == 404 else {}
          check("impact 404 shared envelope",
                impact.status_code == 404
                and i404body.get("error", {}).get("code") == "asset_not_found"
                and bool(i404body.get("error", {}).get("request_id")), impact.text)
          impact_bad = httpx.get(
              f"{base}/assets/00000000-0000-4000-8000-000000000000/impact",
              params={"max_depth": 0}, timeout=5)
          ibadbody = impact_bad.json() if impact_bad.status_code == 422 else {}
          check("impact 422 validation envelope",
                impact_bad.status_code == 422
                and ibadbody.get("error", {}).get("code") == "validation_error"
                and bool(ibadbody.get("error", {}).get("request_id")), impact_bad.text)
          if asset_id:
              impact_ok = httpx.get(f"{base}/assets/{asset_id}/impact", timeout=5)
              iokbody = impact_ok.json() if impact_ok.status_code == 200 else {}
              check("impact 200 derived shape",
                    impact_ok.status_code == 200
                    and iokbody.get("root_asset_id") == asset_id
                    and isinstance(iokbody.get("descendants"), list)
                    and isinstance(iokbody.get("total"), int), impact_ok.text)
              tag_scoped = httpx.get(f"{base}/tags", params={"project_id": project_id}, timeout=5)
              isb = tag_scoped.json() if tag_scoped.status_code == 200 else {}
              check("tags project-scoped facet",
                    tag_scoped.status_code == 200
                    and any(f.get("name") == "ci-smoke" for f in isb.get("tags", [])),
                    tag_scoped.text)
          else:
              check("impact/tags seeded asset setup", False,
                    "could not register an asset for the derived-endpoint probes")

          # Authoritative job execution statistics (C40) is the newest /api/v1
          # URL the live client calls (getJobStats). Probe the zero-filled
          # snapshot shape, the optional project scope and the shared 404/422
          # envelopes, keeping CI aligned with new endpoints as they go live.
          stats = httpx.get(f"{base}/jobs/stats", timeout=5)
          jsbody = stats.json() if stats.status_code == 200 else {}
          check("jobs/stats 200 snapshot shape",
                stats.status_code == 200 and all(
                    k in jsbody for k in ("total", "by_status", "by_operation",
                                          "success_rate", "in_flight", "completed",
                                          "average_duration_seconds", "generated_at")),
                stats.text)
          check("jobs/stats breakdown shapes",
                isinstance(jsbody.get("by_status"), list)
                and all(isinstance(s, dict) and "status" in s and "count" in s
                        for s in jsbody["by_status"])
                and isinstance(jsbody.get("by_operation"), list)
                and all(isinstance(op, dict) and all(
                    k in op for k in ("operation_id", "total", "succeeded", "failed"))
                    for op in jsbody["by_operation"]),
                stats.text)
          if project_id:
              stats_scoped = httpx.get(
                  f"{base}/jobs/stats", params={"project_id": project_id}, timeout=5)
              sbody = stats_scoped.json() if stats_scoped.status_code == 200 else {}
              check("jobs/stats project scope 200",
                    stats_scoped.status_code == 200
                    and isinstance(sbody.get("by_status"), list),
                    stats_scoped.text)
          else:
              check("jobs/stats project scope setup", False,
                    "could not obtain a project id")
          stats_missing = httpx.get(
              f"{base}/jobs/stats",
              params={"project_id": "00000000-0000-4000-8000-000000000000"}, timeout=5)
          j404body = stats_missing.json() if stats_missing.status_code == 404 else {}
          check("jobs/stats 404 shared envelope",
                stats_missing.status_code == 404
                and j404body.get("error", {}).get("code") == "project_not_found"
                and bool(j404body.get("error", {}).get("request_id")), stats_missing.text)
          stats_bad = httpx.get(
              f"{base}/jobs/stats", params={"project_id": "not-a-uuid"}, timeout=5)
          jbadbody = stats_bad.json() if stats_bad.status_code == 422 else {}
          check("jobs/stats 422 validation envelope",
                stats_bad.status_code == 422
                and jbadbody.get("error", {}).get("code") == "validation_error"
                and bool(jbadbody.get("error", {}).get("request_id")), stats_bad.text)

          # Authoritative conversation and message statistics (C45/C47) is the
          # newest /api/v1 URL the live client calls (getConversationStats).
          # Probe the zero-filled snapshot shape, the optional project scope and
          # the shared 404/422 envelopes, keeping CI aligned with new endpoints
          # as they go live.
          conv_stats = httpx.get(f"{base}/conversations/stats", timeout=5)
          csbody = conv_stats.json() if conv_stats.status_code == 200 else {}
          check("conversations/stats 200 snapshot shape",
                conv_stats.status_code == 200 and all(
                    k in csbody for k in ("total_conversations", "total_messages",
                                          "by_role", "by_status",
                                          "average_messages_per_conversation",
                                          "last_activity_at", "generated_at")),
                conv_stats.text)
          check("conversations/stats breakdown shapes",
                isinstance(csbody.get("by_role"), list)
                and all(isinstance(r, dict) and "role" in r and "count" in r
                        for r in csbody["by_role"])
                and isinstance(csbody.get("by_status"), list)
                and all(isinstance(s, dict) and "status" in s and "count" in s
                        for s in csbody["by_status"]),
                conv_stats.text)
          if project_id:
              conv_scoped = httpx.get(
                  f"{base}/conversations/stats", params={"project_id": project_id}, timeout=5)
              cbody = conv_scoped.json() if conv_scoped.status_code == 200 else {}
              check("conversations/stats project scope 200",
                    conv_scoped.status_code == 200
                    and "total_conversations" in cbody,
                    conv_scoped.text)
          else:
              check("conversations/stats project scope setup", False,
                    "could not obtain a project id")
          conv_missing = httpx.get(
              f"{base}/conversations/stats",
              params={"project_id": "00000000-0000-4000-8000-000000000000"}, timeout=5)
          c404body = conv_missing.json() if conv_missing.status_code == 404 else {}
          check("conversations/stats 404 shared envelope",
                conv_missing.status_code == 404
                and c404body.get("error", {}).get("code") == "project_not_found"
                and bool(c404body.get("error", {}).get("request_id")), conv_missing.text)
          conv_bad = httpx.get(
              f"{base}/conversations/stats", params={"project_id": "not-a-uuid"}, timeout=5)
          cbadbody = conv_bad.json() if conv_bad.status_code == 422 else {}
          check("conversations/stats 422 validation envelope",
                conv_bad.status_code == 422
                and cbadbody.get("error", {}).get("code") == "validation_error"
                and bool(cbadbody.get("error", {}).get("request_id")), conv_bad.text)

          # Authoritative asset inventory statistics (C49/C51) is the newest
          # /api/v1 URL the live client calls (getAssetStats). Probe the
          # zero-filled snapshot shape, the optional project scope and the
          # shared 404/422 envelopes, keeping CI aligned with new endpoints
          # as they go live.
          asset_stats = httpx.get(f"{base}/assets/stats", timeout=5)
          asbody = asset_stats.json() if asset_stats.status_code == 200 else {}
          check("assets/stats 200 snapshot shape",
                asset_stats.status_code == 200 and all(
                    k in asbody for k in ("total", "by_type", "by_status",
                                          "total_size_bytes", "total_versions",
                                          "newest_asset_at", "generated_at")),
                asset_stats.text)
          check("assets/stats breakdown shapes",
                isinstance(asbody.get("by_type"), list)
                and all(isinstance(t, dict) and "type" in t and "count" in t
                        for t in asbody["by_type"])
                and isinstance(asbody.get("by_status"), list)
                and all(isinstance(s, dict) and "status" in s and "count" in s
                        for s in asbody["by_status"]),
                asset_stats.text)
          if project_id:
              asset_scoped = httpx.get(
                  f"{base}/assets/stats", params={"project_id": project_id}, timeout=5)
              ascbody = asset_scoped.json() if asset_scoped.status_code == 200 else {}
              check("assets/stats project scope 200",
                    asset_scoped.status_code == 200
                    and isinstance(ascbody.get("total"), int)
                    and isinstance(ascbody.get("by_type"), list),
                    asset_scoped.text)
          else:
              check("assets/stats project scope setup", False,
                    "could not obtain a project id")
          asset_stats_missing = httpx.get(
              f"{base}/assets/stats",
              params={"project_id": "00000000-0000-4000-8000-000000000000"}, timeout=5)
          a404body = asset_stats_missing.json() if asset_stats_missing.status_code == 404 else {}
          check("assets/stats 404 shared envelope",
                asset_stats_missing.status_code == 404
                and a404body.get("error", {}).get("code") == "project_not_found"
                and bool(a404body.get("error", {}).get("request_id")), asset_stats_missing.text)
          asset_stats_bad = httpx.get(
              f"{base}/assets/stats", params={"project_id": "not-a-uuid"}, timeout=5)
          abadbody = asset_stats_bad.json() if asset_stats_bad.status_code == 422 else {}
          check("assets/stats 422 validation envelope",
                asset_stats_bad.status_code == 422
                and abadbody.get("error", {}).get("code") == "validation_error"
                and bool(abadbody.get("error", {}).get("request_id")), asset_stats_bad.text)

          # Authoritative project portfolio statistics (C53/C55) is the newest
          # /api/v1 URL the live client calls (getProjectStats). Probe the
          # zero-filled snapshot shape, the optional org scope (an unknown but
          # well-formed org yields a zero-filled snapshot, matching
          # GET /projects?org_id=) and the shared 422 envelope, keeping CI aligned
          # with new endpoints as they go live.
          project_stats = httpx.get(f"{base}/projects/stats", timeout=5)
          psbody = project_stats.json() if project_stats.status_code == 200 else {}
          check("projects/stats 200 snapshot shape",
                project_stats.status_code == 200 and all(
                    k in psbody for k in ("total", "by_lifecycle", "active", "archived",
                                          "total_assets", "total_conversations",
                                          "total_jobs", "average_assets_per_project",
                                          "average_jobs_per_project", "newest_project_at",
                                          "generated_at")),
                project_stats.text)
          check("projects/stats lifecycle breakdown shape",
                isinstance(psbody.get("by_lifecycle"), list)
                and all(isinstance(l, dict) and "lifecycle" in l and "count" in l
                        for l in psbody["by_lifecycle"]),
                project_stats.text)
          project_scoped = httpx.get(
              f"{base}/projects/stats",
              params={"org_id": "00000000-0000-4000-8000-000000000000"}, timeout=5)
          psbody_scoped = project_scoped.json() if project_scoped.status_code == 200 else {}
          check("projects/stats unknown org zero-filled 200",
                project_scoped.status_code == 200
                and psbody_scoped.get("total") == 0
                and isinstance(psbody_scoped.get("by_lifecycle"), list),
                project_scoped.text)
          project_stats_bad = httpx.get(
              f"{base}/projects/stats", params={"org_id": "not-a-uuid"}, timeout=5)
          psbadbody = project_stats_bad.json() if project_stats_bad.status_code == 422 else {}
          check("projects/stats 422 validation envelope",
                project_stats_bad.status_code == 422
                and psbadbody.get("error", {}).get("code") == "validation_error"
                and bool(psbadbody.get("error", {}).get("request_id")),
                project_stats_bad.text)

          # Authoritative provider fleet statistics (C57/C59) is the newest
          # /api/v1 URL the live client calls (getProviderStats). Probe the
          # zero-filled snapshot + breakdown shapes, the location/status filters
          # and the shared 422 envelope, keeping CI aligned with new endpoints
          # as they go live.
          provider_stats = httpx.get(f"{base}/providers/stats", timeout=5)
          pstbody = provider_stats.json() if provider_stats.status_code == 200 else {}
          check("providers/stats 200 snapshot shape",
                provider_stats.status_code == 200 and all(
                    k in pstbody for k in ("total", "by_status", "by_location",
                                           "available", "degraded", "unavailable",
                                           "total_capabilities", "unique_operations",
                                           "by_operation", "generated_at")),
                provider_stats.text)
          check("providers/stats breakdown shapes",
                isinstance(pstbody.get("by_status"), list)
                and all(isinstance(s, dict) and "status" in s and "count" in s
                        for s in pstbody["by_status"])
                and isinstance(pstbody.get("by_location"), list)
                and all(isinstance(l, dict) and "location" in l and "count" in l
                        for l in pstbody["by_location"])
                and isinstance(pstbody.get("by_operation"), list)
                and all(isinstance(op, dict) and all(
                    k in op for k in ("operation_id", "providers", "available"))
                    for op in pstbody["by_operation"]),
                provider_stats.text)
          pst_location = httpx.get(
              f"{base}/providers/stats", params={"location": "local"}, timeout=5)
          plbody = pst_location.json() if pst_location.status_code == 200 else {}
          check("providers/stats location filter 200",
                pst_location.status_code == 200
                and isinstance(plbody.get("total"), int)
